name: Build BoxTube signed APKs and publish update

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boxtube-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded project ZIP
        id: archive
        shell: bash
        run: |
          shopt -s nullglob
          archives=(BoxTube*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No BoxTube project ZIP found; nothing to build."
            exit 1
          fi
          selected=""
          for candidate in "${archives[@]}"; do
            if [ "$candidate" = "BoxTube-HEXAGO-ready.zip" ]; then
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            if [ "${#archives[@]}" -eq 1 ]; then
              selected="${archives[0]}"
            else
              echo "Multiple BoxTube ZIPs found and no canonical BoxTube-HEXAGO-ready.zip."
              printf '%s\\n' "${archives[@]}"
              exit 1
            fi
          fi
          echo "zip=$selected" >> "$GITHUB_OUTPUT"
          echo "Using $selected"

      - name: Extract Android project
        id: project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/boxtube-project"
          unzip -q "${{ steps.archive.outputs.zip }}" -d "$RUNNER_TEMP/boxtube-project"
          SETTINGS="$(find "$RUNNER_TEMP/boxtube-project" -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find "$RUNNER_TEMP/boxtube-project" -type f -name settings.gradle -print -quit)"
          fi
          if [ -z "$SETTINGS" ]; then
            echo "ZIP does not contain settings.gradle or settings.gradle.kts."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "app/build.gradle.kts missing"; exit 1; }
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > boxtube.p12
          test -s boxtube.p12

      - name: Build signed release APKs
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD repository secret"; exit 1; }
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="2.0.$VERSION_CODE"
          gradle --no-daemon :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" -Prepo="$GITHUB_REPOSITORY"
          A64="$(find app/build/outputs/apk/release -name '*arm64-v8a*.apk' -print -quit)"
          A32="$(find app/build/outputs/apk/release -name '*armeabi-v7a*.apk' -print -quit)"
          test -n "$A64" || { echo "64-bit APK not found"; find app/build/outputs/apk -type f; exit 1; }
          test -n "$A32" || { echo "32-bit APK not found"; find app/build/outputs/apk -type f; exit 1; }
          cp "$A64" "$GITHUB_WORKSPACE/BoxTube-64bit-arm64-v8a.apk"
          cp "$A32" "$GITHUB_WORKSPACE/BoxTube-32bit-armeabi-v7a.apk"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE"/BoxTube-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoxTube-APK-${{ github.run_number }}
          path: |
            BoxTube-64bit-arm64-v8a.apk
            BoxTube-32bit-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ env.VERSION_CODE }}
          name: BoxTube 2.0.${{ env.VERSION_CODE }}
          body: |
            Signed BoxTube release.
            Install the 64-bit APK on most modern Android phones.
            Use the 32-bit APK only for 32-bit devices.
          files: |
            BoxTube-64bit-arm64-v8a.apk
            BoxTube-32bit-armeabi-v7a.apk
          make_latest: true
